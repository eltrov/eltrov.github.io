<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grid viewer</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #8a8a8a;
    --line: #c9c9c9;
    --head: #f2f2f2;
    --anom: #c0392b;
    --hit: #1a1a1a;
    --cell: 44px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1b1b;
      --fg: #eaeaea;
      --muted: #7d7d7d;
      --line: #444;
      --head: #262626;
      --anom: #ff7b6b;
      --hit: #ffffff;
    }
  }
  html, body { height: 100%; }
  body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg); margin: 0; padding: 16px;
         box-sizing: border-box; display: flex; flex-direction: column; }
  #bar { flex: none; display: flex; gap: 12px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  #foot { flex: none; display: flex; gap: 12px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  #bar label, #foot label { font-size: 14px; display: flex; gap: 6px; align-items: center; }
  #status { color: var(--muted); font-size: 14px; }
  #wrap { flex: 1; min-height: 0; overflow: auto; }

  table { border-collapse: separate; border-spacing: 0; border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
  th { background: var(--head); color: var(--muted); font: 11px system-ui, sans-serif; padding: 2px 4px; border: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  thead th { position: sticky; top: 0; z-index: 2; }
  td { border: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 0; width: var(--cell); height: var(--cell); }

  /* 3x3 grid inside each cell: N top, E right, S bottom, W left, anomaly centre */
  .c {
    display: grid;
    grid-template: repeat(3, 1fr) / repeat(3, 1fr);
    width: var(--cell); height: var(--cell);
    font: 600 13px/1 ui-monospace, Menlo, Consolas, monospace;
    text-align: center;
  }
  .c span { display: flex; align-items: center; justify-content: center; }
  .n { grid-area: 1 / 2; }
  .e { grid-area: 2 / 3; }
  .s { grid-area: 3 / 2; }
  .w { grid-area: 2 / 1; }
  .seed { color: var(--muted); font-weight: 400; opacity: .6; }
  .hit { font-weight: 900; color: var(--hit); }
  .x { grid-area: 2 / 2; color: var(--anom); font-size: 16px; }
</style>
</head>
<body>

<div id="bar">
  <label><input type="checkbox" id="seedOn" checked> Show projected grid</label>
  <span id="status">Loading…</span>
</div>
<div id="wrap"><table id="grid"></table></div>
<div id="foot">
  <label><input type="checkbox" id="base1"> Headers start at 1</label>
  <button id="export" type="button">Download as data.txt</button>
</div>

<script>
const DIRS = ['n', 'e', 's', 'w'];   // f: 0=N 1=E 2=S 3=W
const status = document.getElementById('status');

function parse(text) {
  const cells = new Map();           // "x,y" -> {n,e,s,w,x}
  let maxX = 0, maxY = 0, bad = 0;
  const clean = [];

  // Works on one-object-per-line files and on raw dumps like
  // plaques":[{...},{...}] -- it just finds every flat {...} object.
  const objs = text.match(/\{[^{}]*\}/g) || [];
  for (const raw of objs) {
    let d;
    try { d = JSON.parse(raw); } catch { bad++; continue; }
    if (!Number.isInteger(d.x) || !Number.isInteger(d.y)) { bad++; continue; }

    clean.push(raw);
    const key = d.x + ',' + d.y;
    const cell = cells.get(key) || {};
    cells.set(key, cell);
    maxX = Math.max(maxX, d.x);
    maxY = Math.max(maxY, d.y);

    if (typeof d.icon === 'string') {
      // "icon_h.png" -> "H"
      const m = d.icon.match(/icon_(.+?)\.\w+$/i);
      const dir = DIRS[d.f];
      if (m && dir) cell[dir] = m[1].toUpperCase();
      else bad++;
    } else {
      cell.x = '*';                  // anomalous entry (e.g. "joke")
    }
  }
  return { cells, maxX, maxY, bad, clean };
}

// Seed layer: seed0.txt .. seed3.txt (f0=N, f1=E, f2=S, f3=W).
// Each file is a block of text: one line per row (y), one character per column (x).
// "?" (or a space) means unknown.
const seedGrids = [null, null, null, null];   // each: array of row strings
function seedAt(x, y, dir) {
  const ch = (seedGrids[DIRS.indexOf(dir)]?.[y] || '')[x];
  return ch && ch !== '?' && /\S/.test(ch) ? ch.toUpperCase() : null;
}

let lastClean = [], lastResult = null;
function render({ cells, maxX, maxY, bad, clean }) {
  lastClean = clean;
  lastResult = { cells, maxX, maxY, bad, clean };
  const seedOn = document.getElementById('seedOn').checked;
  if (seedOn) {                        // let the grid grow to cover the seed files
    for (const g of seedGrids) if (g) {
      maxY = Math.max(maxY, g.length - 1);
      for (const row of g) maxX = Math.max(maxX, row.length - 1);
    }
  }
  const t = document.getElementById('grid');
  const off = document.getElementById('base1').checked ? 1 : 0;
  let html = '<thead><tr><th></th>';
  for (let x = 0; x <= maxX; x++) html += `<th>${x + off}</th>`;
  html += '</tr></thead><tbody>';

  for (let y = 0; y <= maxY; y++) {
    html += `<tr><th>${y + off}</th>`;
    for (let x = 0; x <= maxX; x++) {
      const c = cells.get(x + ',' + y) || {};
      let inner = '';
      for (const k of DIRS) {
        const seed = seedOn ? seedAt(x, y, k) : null;
        if (c[k]) inner += `<span class="${k}${seed === c[k] ? ' hit' : ''}">${c[k]}</span>`;
        else if (seed) inner += `<span class="${k} seed">${seed}</span>`;
      }
      if (c.x) inner += '<span class="x">*</span>';
      html += '<td>' + (inner ? `<div class="c">${inner}</div>` : '');
      html += '</td>';
    }
    html += '</tr>';
  }
  t.innerHTML = html + '</tbody>';
  status.textContent = `${cells.size} cells, grid ${maxX + 1} × ${maxY + 1}` +
    (bad ? `, ${bad} line(s) skipped` : '') +
    (seedOn ? ', seed: ' + (seedGrids.some(Boolean)
      ? seedGrids.map((g, f) => g ? 'f' + f : null).filter(Boolean).join(' ') + ' loaded'
      : 'no seed files found') : '');
}

['seedOn', 'base1'].forEach(id =>
  document.getElementById(id).addEventListener('change', () => lastResult && render(lastResult)));

function load(text) { render(parse(text)); }

// Try data_raw.txt, then data.txt, next to the page (works over http).
async function tryFetch(names) {
  for (const n of names) {
    try {
      const r = await fetch(n);
      if (r.ok) { status.dataset.src = n; return r.text(); }
    } catch {}
  }
  throw new Error('none');
}
tryFetch(['data.txt', 'data_raw.txt'])
  .then(t => { load(t); status.textContent = status.dataset.src + ': ' + status.textContent; })
  .catch(() => {
    status.textContent = 'Could not auto-load data.txt (browsers block this when the page is opened as a file). Serve the folder over http (e.g. python -m http.server).';
  });

// Export the parsed objects as a clean one-per-line data.txt
document.getElementById('export').addEventListener('click', () => {
  const blob = new Blob([lastClean.join('\n') + '\n'], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'data.txt';
  a.click();
  URL.revokeObjectURL(a.href);
});

// Seed files: try seed0..seed3.txt next to the page.
function loadSeed(f, text) {
  seedGrids[f] = text.split(/\r?\n/).filter(l => l.length);
  if (lastResult) render(lastResult);
}
for (let f = 0; f < 4; f++)
  fetch(`seed${f}.txt`).then(r => r.ok ? r.text() : Promise.reject())
    .then(t => loadSeed(f, t)).catch(() => {});

</script>
</body>
</html>
