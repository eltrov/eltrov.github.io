<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seed start finder</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#8a8a8a; --line:#c9c9c9; --head:#f2f2f2; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1b1b1b; --fg:#eaeaea; --muted:#7d7d7d; --line:#444; --head:#262626; }
  }
  body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg); margin: 16px; max-width: 640px; }
  .row { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; margin-bottom: 14px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  input { font: 16px ui-monospace, Menlo, Consolas, monospace; padding: 6px 8px; width: 90px;
          background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; }
  input:focus-visible, button:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
  button { font: 14px system-ui, sans-serif; padding: 7px 12px; background: var(--head); color: var(--fg);
           border: 1px solid var(--line); border-radius: 4px; cursor: pointer; }
  #out { font: 18px ui-monospace, Menlo, Consolas, monospace; letter-spacing: 2px; padding: 10px;
         background: var(--head); border: 1px solid var(--line); border-radius: 4px; word-break: break-all; min-height: 1.4em; }
  #note { color: var(--muted); font-size: 14px; margin: 0 0 8px; }
</style>
</head>
<body>

<div class="row">
  <label>Letter <input id="letter" maxlength="1" value="E" autofocus></label>
  <label>Position <input id="pos" type="number" min="1" value="11"></label>
  <label>Length <input id="len" type="number" min="1" value="31"></label>
  <button id="copy" type="button">Copy</button>
</div>

<p id="note"></p>
<div id="out" aria-live="polite"></div>

<script>
const $ = id => document.getElementById(id);

function update() {
  const L = $('letter').value.trim().toUpperCase();
  const pos = parseInt($('pos').value, 10);
  const len = parseInt($('len').value, 10);

  if (!/^[A-Z]$/.test(L) || !(pos >= 1) || !(len >= 1)) {
    $('note').textContent = 'Enter a letter A–Z, a position of 1 or more, and a length of 1 or more.';
    $('out').textContent = '';
    return;
  }

  // Position 1 is the start, so the start letter is (pos - 1) letters before L, wrapping Z -> A.
  const start = (((L.charCodeAt(0) - 65) - (pos - 1)) % 26 + 26) % 26;
  let s = '';
  for (let i = 0; i < len; i++) s += String.fromCharCode(65 + (start + i) % 26);

  $('note').textContent = `Sequence starts with ${String.fromCharCode(65 + start)}.`;
  $('out').textContent = s;
}

['letter', 'pos', 'len'].forEach(id => $(id).addEventListener('input', update));
$('copy').addEventListener('click', () => navigator.clipboard?.writeText($('out').textContent));
update();
</script>
</body>
</html>
