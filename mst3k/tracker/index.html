<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Episode of the Day</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" integrity="sha512-iBBXm8fW90+nuLcSKlbmrPcLa0OT92xO1BIsZ+ywDWZCvqsWgccV3gFoRBv0z+8dLJgyAHIhR35VZc2oM/gI1w==" crossorigin="anonymous" />
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
    <div class="container">
        <h1>Mystery Science Theater 3000</h1>
        <h2>Up Next</h2>
        <h3 id="episode-title">Episode Title Goes Here</h3>
        <button id="watched-btn">Watched</button>

        <div class="progress">
            <div id="progress-fill"></div>
        </div>
        <div id="progress-text"></div>

        <details>
            <summary>Watch history (<span id="history-count">0</span>)</summary>
            <ol id="history-list"></ol>
        </details>
    </div>

    <div class="footer">
        Seed: <span id="seed"></span> &middot;
        <button id="reset-btn">New game</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
